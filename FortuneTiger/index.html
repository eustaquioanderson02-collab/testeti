<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Fortune Tiger - Oficial</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="icons/icon-512.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="history.css">
    <link rel="stylesheet" href="history-detail.css">
    <link rel="stylesheet" href="gamerule.css">
    <style>
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        body { background: #000; color: #fff; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
        .gold-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 50000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .gold-content { background: linear-gradient(145deg, #1a1410, #2a1f18); padding: 30px; border-radius: 35px; border: 1px solid #ffcc0044; width: 92%; max-width: 400px; text-align: center; border-top: 5px solid #ffcc00; box-shadow: 0 30px 100px rgba(0,0,0,1); position: relative; }
        .close-btn { position: absolute; top: 15px; right: 15px; color: #fff; background: rgba(255,255,255,0.05); border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>
    <!-- Overlay de Saldo -->
    <div id="tiger-overlay" style="position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: #111; color: #ffcc00; padding: 10px 25px; border-radius: 30px; z-index: 9999; font-weight: 900; border: 1px solid #ffcc0055; display: none; box-shadow: 0 5px 20px rgba(0,0,0,0.8);">
        SALDO: R$ 0,00
    </div>

    <!-- Botões Flutuantes -->
    <div style="position: fixed; right: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px; z-index: 9998;">
        <button onclick="openPremiumModal()" style="background: #111; border: 2px solid #ffcc00; color: #ffcc00; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; font-size: 24px; box-shadow: 0 0 15px rgba(255,204,0,0.3);">💰</button>
        <button onclick="openWithdraw()" style="background: #111; border: 2px solid #00ffcc; color: #00ffcc; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; font-size: 24px; box-shadow: 0 0 15px rgba(0,255,204,0.3);">💸</button>
    </div>

    <!-- MODAL PREMIUM GOLD ÚNICO -->
    <div id="premium-gold-modal" class="gold-modal">
        <div class="gold-content">
            <button class="close-btn" onclick="closeAll()">✕</button>
            <div style="font-size: 60px; margin-bottom: 10px;">🐯</div>
            <h2 style="color: #ffcc00; margin: 0; font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: -1px;">Recarregar Saldo</h2>
            <p id="cur-bal" style="color: #888; font-size: 11px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;">Saldo: R$ 0,00</p>
            
            <div style="display: flex; gap: 12px; margin-bottom: 25px;">
                <div onclick="selectOffer(120)" style="flex: 1; background: rgba(255,204,0,0.08); border: 1px solid #ffcc0033; border-radius: 20px; padding: 15px; cursor: pointer;">
                    <div style="font-size: 20px; font-weight: 900; color: #fff;">R$ 120</div>
                    <div style="font-size: 10px; color: #ffcc00; font-weight: bold; margin-top: 4px;">+ R$ 120 BÔNUS</div>
                </div>
                <div onclick="selectOffer(200)" style="flex: 1; background: rgba(255,204,0,0.08); border: 1px solid #ffcc0033; border-radius: 20px; padding: 15px; cursor: pointer;">
                    <div style="font-size: 20px; font-weight: 900; color: #fff;">R$ 200</div>
                    <div style="font-size: 10px; color: #ffcc00; font-weight: bold; margin-top: 4px;">+ R$ 200 BÔNUS</div>
                </div>
            </div>

            <div style="margin-bottom: 25px;">
                <input type="text" id="dep-val" value="R$ 120,00" oninput="mask(this)" style="width: 100%; padding: 18px; border-radius: 20px; border: 2px solid #332; background: #000; color: #fff; font-size: 26px; font-weight: 900; text-align: center; outline: none; border-left: 5px solid #ffcc00;">
            </div>

            <button id="btn-gen" onclick="genPix()" style="background: linear-gradient(to right, #ffcc00, #ff8800); border: none; padding: 22px; width: 100%; border-radius: 25px; font-weight: 900; color: #000; cursor: pointer; font-size: 18px; text-transform: uppercase; box-shadow: 0 15px 35px rgba(255,136,0,0.4);">Gerar PIX Agora</button>

            <div id="qr-area" style="display: none; margin-top: 25px; animation: fadeIn 0.5s ease-out forwards;">
                <div style="background: #fff; padding: 12px; border-radius: 20px; display: inline-block; margin-bottom: 20px;">
                    <img id="qr-img" style="width: 200px; height: 200px; display: block;" />
                </div>
                <button onclick="copyCode()" style="background: #222; border: 2px solid #ffcc00; padding: 15px; width: 100%; border-radius: 15px; color: #ffcc00; cursor: pointer; font-weight: 900; font-size: 14px; text-transform: uppercase;">COPIAR CÓDIGO PIX</button>
            </div>
            <p style="font-size: 10px; color: #444; margin-top: 20px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold;">Seguro via SigiloPay</p>
        </div>
    </div>

    <!-- Modal de Saque -->
    <div id="withdraw-modal" class="gold-modal">
        <div class="gold-content" style="border-top-color: #00ffcc;">
            <button class="close-btn" onclick="closeAll()">✕</button>
            <h2 style="color: #00ffcc; margin: 0 0 10px 0; font-size: 24px; font-weight: 900; text-transform: uppercase;">Solicitar Saque</h2>
            <div style="background: rgba(0,255,204,0.1); border-radius: 20px; padding: 20px; margin-bottom: 25px;">
                <p id="wd-bal" style="font-size: 32px; color: #00ffcc; font-weight: 900; margin: 0;">R$ 0,00</p>
            </div>
            <input type="text" id="wd-val" placeholder="Valor (R$)" oninput="mask(this)" style="width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #332; background: #000; color: #fff; font-size: 20px; text-align: center; margin-bottom: 15px; outline: none;">
            <input type="text" id="wd-key" placeholder="Chave PIX" style="width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #332; background: #000; color: #fff; font-size: 16px; text-align: center; margin-bottom: 20px; outline: none;">
            <button onclick="doWd()" style="background: #00ffcc; border: none; padding: 18px; width: 100%; border-radius: 20px; font-weight: 900; color: #000; cursor: pointer; text-transform: uppercase;">Confirmar Saque</button>
        </div>
    </div>

    <script>
        let gReal = 0, gBonus = 0, initial = true;

        function openPremiumModal() {
            document.getElementById('premium-gold-modal').style.display = 'flex';
            document.getElementById('cur-bal').innerText = 'Saldo: R$ ' + (gReal + gBonus).toFixed(2).replace('.',',');
            document.getElementById('qr-area').style.display = 'none';
            document.getElementById('btn-gen').style.display = 'block';
        }

        function openWithdraw() {
            document.getElementById('withdraw-modal').style.display = 'flex';
            document.getElementById('wd-bal').innerText = 'R$ ' + gReal.toFixed(2).replace('.',',');
        }

        function closeAll() {
            document.querySelectorAll('.gold-modal').forEach(m => m.style.display = 'none');
        }

        function mask(i) {
            let v = i.value.replace(/\D/g, "");
            if(!v) { i.value = ""; return; }
            i.value = "R$ " + (parseInt(v)/100).toFixed(2).replace('.',',').replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
        }

        function getVal(s) { return parseFloat(s.replace(/\D/g, '').replace(/^0+/, '')) / 100; }

        function selectOffer(v) {
            document.getElementById('dep-val').value = "R$ " + v.toFixed(2).replace('.',',');
            genPix();
        }

        function genPix() {
            const amt = getVal(document.getElementById('dep-val').value);
            if(amt < 1) return alert('Mínimo R$ 1,00');
            const btn = document.getElementById('btn-gen');
            btn.innerText = 'PROCESSANDO...'; btn.disabled = true;

            fetch('/api/payment/deposit', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': new URLSearchParams(window.location.search).get('token') },
                body: JSON.stringify({ amount: amt })
            }).then(r=>r.json()).then(d=>{
                if(d.success) {
                    document.getElementById('qr-area').style.display = 'block';
                    document.getElementById('qr-img').src = d.qr_code;
                    document.getElementById('qr-area').dataset.copy = d.copy_paste;
                    btn.style.display = 'none';
                } else alert(d.message || 'Erro');
                btn.innerText = 'Gerar PIX Agora'; btn.disabled = false;
            }).catch(() => { btn.innerText = 'Gerar PIX Agora'; btn.disabled = false; });
        }

        function copyCode() {
            const c = document.getElementById('qr-area').dataset.copy;
            const t = document.createElement('textarea'); t.value = c; document.body.appendChild(t);
            t.select(); document.execCommand('copy'); document.body.removeChild(t);
            alert('PIX Copiado!');
        }

        function doWd() {
            const amt = getVal(document.getElementById('wd-val').value);
            const key = document.getElementById('wd-key').value.trim();
            if(amt < 10) return alert('Mínimo R$ 10,00');
            if(amt > gReal) return alert('Saldo insuficiente');
            if(!key) return alert('Informe a chave');
            fetch('/api/payment/withdraw', {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': new URLSearchParams(window.location.search).get('token') },
                body: JSON.stringify({ amount: amt, pixKey: key })
            }).then(r=>r.json()).then(d=>{
                if(d.success) { alert('Saque solicitado!'); closeAll(); } else alert(d.message);
            });
        }

        (function() {
            const originalSend = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.send = function() {
                this.addEventListener('load', function() {
                    if (this.responseURL && this.responseURL.includes('/spin') && this.status === 200) {
                        try {
                            const data = JSON.parse(this.responseText);
                            if (data.success === false) openPremiumModal();
                        } catch(e) {}
                    }
                });
                return originalSend.apply(this, arguments);
            };

            function check() {
                const token = new URLSearchParams(window.location.search).get('token');
                if (!token) return;
                fetch(`/api/data/${token}/session`).then(r => r.json()).then(data => {
                    if (data.success) {
                        const d = data.data;
                        gReal = d.real_balance || 0;
                        gBonus = d.bonus_balance || 0;
                        const total = gReal + gBonus;
                        const ov = document.getElementById('tiger-overlay');
                        if(ov) {
                            ov.innerText = `SALDO: R$ ${total.toFixed(2).replace('.', ',')}`;
                            ov.style.display = 'block';
                        }
                        initial = false;
                    }
                });
            }
            setTimeout(check, 1000);
            setInterval(check, 10000);
        })();
    </script>

    <script src="spine-webgl.js"></script>
    <script src="spine-draw.js"></script>
    <script src="spine-gl-cache.js"></script>
    <script src="spine-bone-control.js"></script>
    <script src="spine-palette.js"></script>
    <script src="scripts/supportcheck.js"></script>
    <script src="scripts/offlineclient.js" type="module"></script>
    <script src="scripts/main.js" type="module"></script>
    <script src="scripts/register-sw.js" type="module"></script>
</body>
</html>
