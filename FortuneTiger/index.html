<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fortune_Tiger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="generator" content="Scirra Construct">
  <link rel="manifest" href="appmanifest.json">
  <link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128.png">
  <link rel="apple-touch-icon" sizes="256x256" href="icons/icon-256.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
  <link rel="icon" type="image/png" href="icons/icon-512.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="history.css">
  <link rel="stylesheet" href="history-detail.css">
  <link rel="stylesheet" href="gamerule.css">
</head>
<body style="background: #000; color: #fff;"> 
  <script>
    (function() {
        const token = new URLSearchParams(window.location.search).get('token');
        if (!token) {
            const gToken = 'guest_' + Math.random().toString(36).substring(7);
            fetch('/api/game/launch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: gToken })
            }).then(r => r.json()).then(data => {
                if (data.success && data.url) {
                    window.location.replace(data.url);
                }
            }).catch(e => console.error(e));
        }
    })();
  </script>
  <!-- Overlay de Saldo -->
  <div id="tiger-overlay" style="position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #ffcc00; padding: 10px 25px; border-radius: 30px; z-index: 9999; font-family: 'Arial', sans-serif; font-weight: bold; border: 1px solid #ffcc0066; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-size: 14px; pointer-events: none;">
    CARREGANDO SALDO...
  </div>

  <!-- Floating Action Buttons -->
  <div style="position: fixed; right: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px; z-index: 9998; opacity: 0.85;">
    <button onclick="openDepositModal()" style="background: rgba(20,20,20,0.8); border: 2px solid #ffcc00; color: #ffcc00; padding: 12px; border-radius: 50%; width: 55px; height: 55px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(255,204,0,0.3); font-size: 24px;">💰</button>
    <button onclick="openWithdrawModal()" style="background: rgba(20,20,20,0.8); border: 2px solid #00ffcc; color: #00ffcc; padding: 12px; border-radius: 50%; width: 55px; height: 55px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0,255,204,0.3); font-size: 24px;">💸</button>
  </div>

  <!-- Deposit Modal -->
  <div id="tiger-deposit-modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: none; align-items: center; justify-content: center; text-align: center; font-family: 'Arial', sans-serif; color: #fff; backdrop-filter: blur(5px);">
    <div style="background: #1a1410; padding: 30px; border-radius: 20px; border: 1px solid #ffcc0044; width: 90%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative;">
        <button onclick="closeModals()" style="position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: #aaa; font-size: 20px; cursor: pointer;">✖</button>
        <h2 style="color: #ffcc00; margin-bottom: 20px; font-size: 22px;">Depositar PIX</h2>
        <input type="text" id="dep-amount" placeholder="R$ 0,00" oninput="maskCurrency(this)" style="width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #443; background: #000; color: #fff; font-size: 24px; text-align: center; margin-bottom: 20px; box-sizing: border-box; outline: none;">
        <button id="dep-btn" onclick="generatePix()" style="background: linear-gradient(45deg, #ff4d00, #ffcc00); border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; color: #000; cursor: pointer; font-size: 16px;">GERAR PIX</button>
        <div id="dep-qr-container" style="display: none; margin-top: 20px;">
            <img id="dep-qr" style="width: 200px; height: 200px; border-radius: 10px; border: 2px solid #ffcc00; margin: 0 auto 15px auto; display: block;" />
            <input type="text" id="dep-copy" readonly style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #555; background: #222; color: #fff; font-size: 12px; text-align: center; margin-bottom: 10px; box-sizing: border-box;">
            <button onclick="copyPix()" style="background: #333; border: 1px solid #ffcc00; padding: 10px; width: 100%; border-radius: 8px; color: #ffcc00; cursor: pointer; font-weight: bold;">COPIAR CÓDIGO PIX</button>
        </div>
    </div>
  </div>

  <!-- Withdraw Modal -->
  <div id="tiger-withdraw-modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: none; align-items: center; justify-content: center; text-align: center; font-family: 'Arial', sans-serif; color: #fff; backdrop-filter: blur(5px);">
    <div style="background: #1a1410; padding: 30px; border-radius: 20px; border: 1px solid #00ffcc44; width: 90%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative;">
        <button onclick="closeModals()" style="position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: #aaa; font-size: 20px; cursor: pointer;">✖</button>
        <h2 style="color: #00ffcc; margin-bottom: 10px; font-size: 22px;">Solicitar Saque</h2>
        <div style="background: rgba(0,255,204,0.1); border: 1px solid rgba(0,255,204,0.3); border-radius: 12px; padding: 15px; margin-bottom: 20px;">
            <div style="font-size: 14px; color: #aaa; margin-bottom: 5px;">Saldo Real (Sacável)</div>
            <div id="wd-real-balance" style="font-size: 28px; color: #00ffcc; font-weight: bold;">R$ 0,00</div>
            <div id="wd-bonus-balance" style="font-size: 12px; color: #ffcc00; margin-top: 8px;">Saldo de Bônus: R$ 0,00</div>
        </div>
        
        <input type="text" id="wd-amount" placeholder="Valor a Sacar (R$)" oninput="maskCurrency(this)" style="width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #443; background: #000; color: #fff; font-size: 18px; text-align: center; margin-bottom: 15px; box-sizing: border-box; outline: none;">
        
        <input type="text" id="wd-pixkey" placeholder="Chave PIX (CPF, Celular, E-mail)" oninput="detectPixType(this)" style="width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #443; background: #000; color: #fff; font-size: 16px; text-align: center; margin-bottom: 5px; box-sizing: border-box; outline: none;">
        <div id="wd-pixtype" style="font-size: 11px; color: #aaa; text-align: right; margin-bottom: 20px;">Tipo detectado: Nenhum</div>
        
        <button id="wd-btn" onclick="requestWithdraw()" style="background: linear-gradient(45deg, #00b386, #00ffcc); border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; color: #000; cursor: pointer; font-size: 16px;">CONFIRMAR SAQUE</button>
    </div>
  </div>

  <!-- Modal de Saldo Insuficiente -->
  <div id="low-balance-modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: none; align-items: center; justify-content: center; text-align: center; font-family: 'Arial', sans-serif; color: #fff; backdrop-filter: blur(5px);">
    <div style="background: #1a1410; padding: 40px; border-radius: 28px; border: 1px solid #ffcc0044; max-width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);">
        <div style="font-size: 50px; margin-bottom: 15px;">🐯</div>
        <h2 style="color: #ffcc00; margin-bottom: 12px; font-size: 24px;">Saldo Insuficiente</h2>
        <p id="low-balance-msg" style="color: #a0a0a0; font-size: 15px; margin-bottom: 25px; line-height: 1.4;">Seu bônus acabou. Faça um depósito para continuar sua sorte!</p>
        <button id="low-balance-btn" style="background: linear-gradient(45deg, #ff4d00, #ffcc00); border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: 800; color: #000; cursor: pointer; font-size: 16px; box-shadow: 0 10px 20px rgba(255,77,0,0.3);">DEPOSITAR AGORA</button>
    </div>
  </div>

  <script>
    let globalReal = 0;
    let globalBonus = 0;

    // Mascara de Dinheiro Brasileira R$
    function maskCurrency(input) {
        let value = input.value.replace(/\D/g, "");
        if(value === "") { input.value = ""; return; }
        value = (parseInt(value) / 100).toFixed(2) + "";
        value = value.replace(".", ",");
        value = value.replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
        input.value = "R$ " + value;
    }

    function getNum(str) {
        if(!str) return 0;
        return parseFloat(str.replace(/\D/g, '').replace(/^0+/, '')) / 100;
    }

    let detectedPixType = 'RANDOM';
    function detectPixType(input) {
        const val = input.value.trim();
        const typeLabel = document.getElementById('wd-pixtype');
        if(val.includes('@')) {
            detectedPixType = 'EMAIL';
            typeLabel.innerText = 'Tipo detectado: E-mail';
        } else if (val.replace(/\D/g, '').length === 11) {
            detectedPixType = 'CPF';
            typeLabel.innerText = 'Tipo detectado: CPF';
        } else if (val.replace(/\D/g, '').length === 14) {
            detectedPixType = 'CNPJ';
            typeLabel.innerText = 'Tipo detectado: CNPJ';
        } else if (val.replace(/\D/g, '').length === 12 || val.replace(/\D/g, '').length === 13 || val.replace(/\D/g, '').length === 10) {
            detectedPixType = 'PHONE';
            typeLabel.innerText = 'Tipo detectado: Celular';
        } else if (val.length > 20) {
            detectedPixType = 'RANDOM';
            typeLabel.innerText = 'Tipo detectado: Chave Aleatória';
        } else {
            detectedPixType = 'RANDOM';
            typeLabel.innerText = 'Tipo detectado: Desconhecido';
        }
    }

    function openDepositModal() { 
        document.getElementById('tiger-deposit-modal').style.display = 'flex'; 
    }
    
    function openWithdrawModal() { 
        document.getElementById('wd-real-balance').innerText = 'R$ ' + globalReal.toFixed(2).replace('.',',');
        document.getElementById('wd-bonus-balance').innerText = 'Saldo de Bônus: R$ ' + globalBonus.toFixed(2).replace('.',',');
        document.getElementById('tiger-withdraw-modal').style.display = 'flex'; 
    }
    
    function closeModals() { 
        document.getElementById('tiger-deposit-modal').style.display = 'none'; 
        document.getElementById('tiger-withdraw-modal').style.display = 'none';
        document.getElementById('low-balance-modal').style.display = 'none';
    }

    function generatePix() {
        const amt = getNum(document.getElementById('dep-amount').value);
        if(amt < 2) { alert('Mínimo R$ 2,00'); return; }
        const btn = document.getElementById('dep-btn');
        btn.innerText = 'GERANDO...';
        btn.disabled = true;
        fetch('/api/payment/deposit', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': new URLSearchParams(window.location.search).get('token') },
            body: JSON.stringify({ amount: amt })
        }).then(r=>r.json()).then(d=>{
            if(d.success) {
                document.getElementById('dep-qr-container').style.display = 'block';
                document.getElementById('dep-qr').src = d.qr_code;
                document.getElementById('dep-copy').value = d.copy_paste;
                btn.style.display = 'none';
            } else {
                alert(d.message || 'Erro ao gerar PIX');
                btn.innerText = 'GERAR PIX';
                btn.disabled = false;
            }
        }).catch(e=>{
            alert('Erro na conexão');
            btn.innerText = 'GERAR PIX';
            btn.disabled = false;
        });
    }

    function copyPix() {
        const cp = document.getElementById('dep-copy');
        cp.select();
        document.execCommand('copy');
        alert('Código PIX Copiado!');
    }

    function requestWithdraw() {
        const amt = getNum(document.getElementById('wd-amount').value);
        const key = document.getElementById('wd-pixkey').value.trim();
        if(amt < 10) { alert('O valor mínimo de saque é R$ 10,00'); return; }
        if(amt > globalReal) { alert('Você não tem esse saldo Real disponível!'); return; }
        if(!key) { alert('Informe a chave PIX'); return; }
        
        const btn = document.getElementById('wd-btn');
        btn.innerText = 'SOLICITANDO...';
        btn.disabled = true;

        fetch('/api/payment/withdraw', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': new URLSearchParams(window.location.search).get('token') },
            body: JSON.stringify({ amount: amt, pixKey: key, keyType: detectedPixType })
        }).then(r=>r.json()).then(d=>{
            if(d.success) {
                alert('Saque solicitado com sucesso! Em breve estará na sua conta.');
                closeModals();
            } else {
                alert(d.message || 'Erro ao solicitar saque.');
            }
            btn.innerText = 'CONFIRMAR SAQUE';
            btn.disabled = false;
        }).catch(e=>{
            alert('Erro na conexão');
            btn.innerText = 'CONFIRMAR SAQUE';
            btn.disabled = false;
        });
    }

    // Intercepta Requisições do Motor do Jogo (Evita saldo negativo)
    const originalFetch = window.fetch;
    window.fetch = async function(...args) {
        const response = await originalFetch.apply(this, args);
        if (args[0] && args[0].includes('/spin') && response.status === 400) {
            const clone = response.clone();
            clone.json().then(data => {
                if(data.message && data.message.includes('Saldo')) {
                    openDepositModal(); // Abre PIX se não tiver saldo para rodar
                }
            });
        }
        return response;
    };

    (function() {
        const overlay = document.getElementById('tiger-overlay');
        const modal = document.getElementById('low-balance-modal');
        const msg = document.getElementById('low-balance-msg');
        const btn = document.getElementById('low-balance-btn');
        let initialCheck = true;

        function checkBalance() {
            const token = new URLSearchParams(window.location.search).get('token');
            if (!token) return;

            fetch(`/api/data/${token}/session`)
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        const isGuest = token.startsWith('guest_');
                        globalBonus = data.data.bonus_balance || 0;
                        globalReal = data.data.real_balance || 0;
                        const total = data.data.credit || 0;

                        if (total < 1) {
                            modal.style.display = 'flex';
                            if (isGuest) {
                                msg.innerText = 'Seu bônus de teste acabou. Crie sua conta para ganhar de verdade!';
                                btn.innerText = 'CRIAR CONTA AGORA';
                                btn.onclick = () => window.location.href = '/';
                            } else {
                                msg.innerText = 'Seu bônus de jogo acabou. Deposite via PIX para continuar jogando!';
                                btn.innerText = 'DEPOSITAR VIA PIX';
                                btn.onclick = () => window.location.href = '/';
                            }
                        } else if (initialCheck) {
                            overlay.style.display = 'block';
                            if (globalBonus > 0) {
                                overlay.innerHTML = `USANDO SALDO DE BÔNUS: R$ ${globalBonus.toFixed(2).replace('.', ',')}`;
                            } else {
                                overlay.innerHTML = `USANDO SALDO REAL: R$ ${globalReal.toFixed(2).replace('.', ',')}`;
                            }
                            initialCheck = false;
                            setTimeout(() => { 
                                overlay.style.opacity = '0'; 
                                overlay.style.transition = 'opacity 1s ease-in-out';
                                setTimeout(() => overlay.style.display = 'none', 1000);
                            }, 5000);
                        }
                    }
                });
        }
        
        setTimeout(checkBalance, 1500);
        setInterval(checkBalance, 8000); // Polling suave para manter o estado atualizado
    })();
  </script>

  <script src="spine-draw.js"></script>
  <script src="spine-gl-cache.js"></script>
  <script src="spine-bone-control.js"></script>
  <script src="spine-palette.js"></script>

      <h2 id="notSupportedTitle">This content requires JavaScript</h2>
      <p class="notSupportedMessage">JavaScript appears to be disabled. Please enable it to view this content.</p>
    </div>
  </noscript>
  <script src="scripts/supportcheck.js"></script>
  <script src="scripts/offlineclient.js" type="module"></script>
  <script src="scripts/main.js" type="module"></script>
  <script src="scripts/register-sw.js" type="module"></script>
</body>
</html>
