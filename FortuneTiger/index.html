<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fortune_Tiger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="generator" content="Scirra Construct">
  <link rel="manifest" href="appmanifest.json">
  <link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128.png">
  <link rel="apple-touch-icon" sizes="256x256" href="icons/icon-256.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
  <link rel="icon" type="image/png" href="icons/icon-512.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="history.css">
  <link rel="stylesheet" href="history-detail.css">
  <link rel="stylesheet" href="gamerule.css">
</head>
<body style="background: #000; color: #fff; margin: 0; padding: 0; overflow: hidden;"> 
  
  <!-- Overlay de Saldo (Obrigatório para o script não dar erro) -->
  <div id="tiger-overlay" style="position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #ffcc00; padding: 10px 25px; border-radius: 30px; z-index: 9999; font-family: 'Arial', sans-serif; font-weight: bold; border: 1px solid #ffcc0066; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-size: 14px; pointer-events: none;">
    CARREGANDO SALDO...
  </div>

  <!-- Botões Flutuantes -->
  <div style="position: fixed; right: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px; z-index: 9998; opacity: 0.85;">
    <button onclick="openDeposit()" style="background: rgba(20,20,20,0.8); border: 2px solid #ffcc00; color: #ffcc00; padding: 12px; border-radius: 50%; width: 55px; height: 55px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(255,204,0,0.3); font-size: 24px;">💰</button>
    <button onclick="openWithdrawModal()" style="background: rgba(20,20,20,0.8); border: 2px solid #00ffcc; color: #00ffcc; padding: 12px; border-radius: 50%; width: 55px; height: 55px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0,255,204,0.3); font-size: 24px;">💸</button>
  </div>

  <!-- Scripts do Jogo e Sistema Premium -->
  <script>
    let globalReal = 0;
    let globalBonus = 0;
    let isFirstDeposit = 1;
    let initialCheck = true;

    // INICIALIZAÇÃO DE TOKEN
    (function() {
        const token = new URLSearchParams(window.location.search).get('token');
        if (!token) {
            const gToken = 'guest_' + Math.random().toString(36).substring(7);
            fetch('/api/game/launch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: gToken })
            }).then(r => r.json()).then(data => {
                if (data.success && data.url) window.location.replace(data.url);
            });
        }
    })();

    // MODAL PREMIUM UNIFICADO (HTML)
    const premiumModalHTML = `
    <div id="tiger-premium-modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 30000; display: none; align-items: center; justify-content: center; font-family: 'Arial', sans-serif; color: #fff; backdrop-filter: blur(15px);">
        <div style="background: linear-gradient(145deg, #1a1410, #2a1f18); padding: 30px; border-radius: 35px; border: 1px solid #ffcc0044; width: 92%; max-width: 400px; box-shadow: 0 25px 80px rgba(0,0,0,1); position: relative; text-align: center; border-top: 5px solid #ffcc00;">
            <button onclick="closeModals()" style="position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.05); border: none; color: #fff; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 20px;">✖</button>
            <div style="font-size: 55px; margin-bottom: 10px; filter: drop-shadow(0 0 10px #ffcc0044);">🐯</div>
            <h2 style="color: #ffcc00; margin: 0; font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: -1px;">Recarregar Saldo</h2>
            <p id="current-bal-display" style="color: #888; font-size: 11px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;">Saldo Atual: R$ 0,00</p>
            <div style="display: flex; gap: 12px; margin-bottom: 25px;">
                <div onclick="selectPromo(1)" style="flex: 1; background: rgba(255,204,0,0.06); border: 1px solid #ffcc0022; border-radius: 20px; padding: 15px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='rgba(255,204,0,0.12)'" onmouseout="this.style.background='rgba(255,204,0,0.06)'">
                    <div id="promo1-val" style="font-size: 20px; font-weight: 900; color: #fff;">R$ 120</div>
                    <div id="promo1-bonus" style="font-size: 10px; color: #ffcc00; font-weight: bold; margin-top: 4px;">+ R$ 120 BÔNUS</div>
                </div>
                <div onclick="selectPromo(2)" style="flex: 1; background: rgba(255,204,0,0.06); border: 1px solid #ffcc0022; border-radius: 20px; padding: 15px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='rgba(255,204,0,0.12)'" onmouseout="this.style.background='rgba(255,204,0,0.06)'">
                    <div id="promo2-val" style="font-size: 20px; font-weight: 900; color: #fff;">R$ 200</div>
                    <div id="promo2-bonus" style="font-size: 10px; color: #ffcc00; font-weight: bold; margin-top: 4px;">+ R$ 200 BÔNUS</div>
                </div>
            </div>
            <div style="margin-bottom: 25px;">
                <label style="display: block; font-size: 10px; color: #ffcc00; text-transform: uppercase; margin-bottom: 8px; text-align: left; font-weight: bold; opacity: 0.7;">Valor Personalizado</label>
                <input type="text" id="low-dep-amount" value="R$ 120,00" oninput="maskCurrency(this)" style="width: 100%; padding: 18px; border-radius: 18px; border: 2px solid #332; background: #000; color: #fff; font-size: 24px; font-weight: 900; text-align: center; box-sizing: border-box; outline: none; border-left: 5px solid #ffcc00;">
            </div>
            <button id="low-dep-btn" onclick="generatePixLow()" style="background: linear-gradient(to right, #ffcc00, #ff8800); border: none; padding: 20px; width: 100%; border-radius: 22px; font-weight: 900; color: #000; cursor: pointer; font-size: 18px; box-shadow: 0 15px 35px rgba(255,136,0,0.3); text-transform: uppercase; transition: 0.2s;" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">Gerar PIX Agora</button>
            <div id="low-qr-container" style="display: none; margin-top: 25px;">
                <div style="background: #fff; padding: 12px; border-radius: 20px; display: inline-block; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                    <img id="low-qr" style="width: 200px; height: 200px; display: block;" />
                </div>
                <button onclick="copyPixLow()" style="background: #222; border: 2px solid #ffcc00; padding: 15px; width: 100%; border-radius: 15px; color: #ffcc00; cursor: pointer; font-weight: 900; font-size: 14px; text-transform: uppercase;">COPIAR CÓDIGO PIX</button>
            </div>
            <p style="font-size: 10px; color: #444; margin-top: 20px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold;">Seguro via SigiloPay</p>
        </div>
    </div>

    <!-- Modal de Saque Básico (Precisa existir) -->
    <div id="tiger-withdraw-modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: none; align-items: center; justify-content: center; text-align: center; font-family: 'Arial', sans-serif; color: #fff; backdrop-filter: blur(5px);">
        <div style="background: #1a1410; padding: 30px; border-radius: 20px; border: 1px solid #00ffcc44; width: 90%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative;">
            <button onclick="closeModals()" style="position: absolute; top: 15px; right: 15px; background: transparent; border: none; color: #aaa; font-size: 20px; cursor: pointer;">✖</button>
            <h2 style="color: #00ffcc; margin-bottom: 10px; font-size: 22px;">Solicitar Saque</h2>
            <div style="background: rgba(0,255,204,0.1); border: 1px solid rgba(0,255,204,0.3); border-radius: 12px; padding: 15px; margin-bottom: 20px;">
                <div style="font-size: 14px; color: #aaa; margin-bottom: 5px;">Saldo Real (Sacável)</div>
                <div id="wd-real-balance" style="font-size: 28px; color: #00ffcc; font-weight: bold;">R$ 0,00</div>
                <div id="wd-bonus-balance" style="font-size: 12px; color: #ffcc00; margin-top: 8px;">Saldo de Bônus: R$ 0,00</div>
            </div>
            <input type="text" id="wd-amount" placeholder="Valor a Sacar (R$)" oninput="maskCurrency(this)" style="width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #443; background: #000; color: #fff; font-size: 18px; text-align: center; margin-bottom: 15px; box-sizing: border-box; outline: none;">
            <input type="text" id="wd-pixkey" placeholder="Chave PIX" style="width: 100%; padding: 15px; border-radius: 10px; border: 1px solid #443; background: #000; color: #fff; font-size: 16px; text-align: center; margin-bottom: 20px; box-sizing: border-box; outline: none;">
            <button onclick="requestWithdraw()" style="background: linear-gradient(45deg, #00b386, #00ffcc); border: none; padding: 15px; width: 100%; border-radius: 12px; font-weight: bold; color: #000; cursor: pointer; font-size: 16px;">CONFIRMAR SAQUE</button>
        </div>
    </div>
    `;

    // Injeta o HTML do modal agora que o BODY existe
    window.addEventListener('DOMContentLoaded', () => {
        document.body.insertAdjacentHTML('beforeend', premiumModalHTML);
    });

    // FUNÇÕES DE CONTROLE
    function openDeposit() {
        const display = document.getElementById('current-bal-display');
        if(display) display.innerText = 'Saldo Atual: R$ ' + (globalReal + globalBonus).toFixed(2).replace('.',',');
        updatePromos();
        const modal = document.getElementById('tiger-premium-modal');
        if(modal) modal.style.display = 'flex';
        if(document.getElementById('low-qr-container')) document.getElementById('low-qr-container').style.display = 'none';
        if(document.getElementById('low-dep-btn')) document.getElementById('low-dep-btn').style.display = 'block';
    }

    function openWithdrawModal() {
        const wdReal = document.getElementById('wd-real-balance');
        const wdBonus = document.getElementById('wd-bonus-balance');
        if(wdReal) wdReal.innerText = 'R$ ' + globalReal.toFixed(2).replace('.',',');
        if(wdBonus) wdBonus.innerText = 'Saldo de Bônus: R$ ' + globalBonus.toFixed(2).replace('.',',');
        const modal = document.getElementById('tiger-withdraw-modal');
        if(modal) modal.style.display = 'flex';
    }

    function closeModals() {
        ['tiger-premium-modal', 'tiger-withdraw-modal'].forEach(id => {
            const el = document.getElementById(id);
            if(el) el.style.display = 'none';
        });
    }

    function maskCurrency(input) {
        let value = input.value.replace(/\D/g, "");
        if(value === "") { input.value = ""; return; }
        value = (parseInt(value) / 100).toFixed(2) + "";
        input.value = "R$ " + value.replace(".", ",").replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
    }

    function getNum(str) {
        if(!str) return 0;
        return parseFloat(str.replace(/\D/g, '').replace(/^0+/, '')) / 100;
    }

    function selectPromo(num) {
        const val = (num === 1) ? 120 : 200;
        const input = document.getElementById('low-dep-amount');
        if(input) {
            input.value = "R$ " + val.toFixed(2).replace('.',',');
            generatePixLow();
        }
    }

    function updatePromos() {
        const el1 = document.getElementById('promo1-val');
        const el2 = document.getElementById('promo2-val');
        if(el1) el1.innerText = "R$ 120";
        if(el2) el2.innerText = "R$ 200";
    }

    function generatePixLow() {
        const amtInput = document.getElementById('low-dep-amount');
        const amt = amtInput ? getNum(amtInput.value) : 0;
        if(amt < 1) { alert('Mínimo R$ 1,00'); return; }
        const btn = document.getElementById('low-dep-btn');
        if(btn) { btn.innerText = 'PROCESSANDO...'; btn.disabled = true; }

        fetch('/api/payment/deposit', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': new URLSearchParams(window.location.search).get('token') },
            body: JSON.stringify({ amount: amt })
        }).then(r=>r.json()).then(d=>{
            if(d.success) {
                document.getElementById('low-qr-container').style.display = 'block';
                document.getElementById('low-qr').src = d.qr_code;
                document.getElementById('low-qr-container').dataset.copy = d.copy_paste;
                btn.style.display = 'none';
            } else {
                alert(d.message || 'Erro ao gerar PIX');
                btn.innerText = 'Gerar PIX Agora'; btn.disabled = false;
            }
        }).catch(() => { if(btn) { btn.innerText = 'Gerar PIX Agora'; btn.disabled = false; } });
    }

    function copyPixLow() {
        const code = document.getElementById('low-qr-container').dataset.copy;
        const el = document.createElement('textarea');
        el.value = code; document.body.appendChild(el);
        el.select(); document.execCommand('copy');
        document.body.removeChild(el);
        alert('Código PIX Copiado!');
    }

    function requestWithdraw() {
        const amtInput = document.getElementById('wd-amount');
        const keyInput = document.getElementById('wd-pixkey');
        const amt = amtInput ? getNum(amtInput.value) : 0;
        const key = keyInput ? keyInput.value.trim() : '';
        if(amt < 10) { alert('Mínimo R$ 10,00'); return; }
        if(amt > globalReal) { alert('Saldo insuficiente!'); return; }
        if(!key) { alert('Informe a chave PIX'); return; }
        
        fetch('/api/payment/withdraw', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': new URLSearchParams(window.location.search).get('token') },
            body: JSON.stringify({ amount: amt, pixKey: key })
        }).then(r=>r.json()).then(d=>{
            if(d.success) { alert('Saque solicitado!'); closeModals(); } else alert(d.message);
        });
    }

    // MONITOR DE SALDO E INTERCEPTADOR (XHR)
    (function() {
        const originalSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function() {
            this.addEventListener('load', function() {
                if (this.responseURL && this.responseURL.includes('/spin') && this.status === 200) {
                    try {
                        const data = JSON.parse(this.responseText);
                        if (data.success === false) openDeposit();
                    } catch(e) {}
                }
            });
            return originalSend.apply(this, arguments);
        };

        function check() {
            const token = new URLSearchParams(window.location.search).get('token');
            if (!token) return;
            fetch(`/api/data/${token}/session`).then(r => r.json()).then(data => {
                if (data.success) {
                    const d = data.data;
                    globalReal = d.real_balance || 0;
                    globalBonus = d.bonus_balance || 0;
                    const total = globalReal + globalBonus;
                    const overlay = document.getElementById('tiger-overlay');
                    if(overlay) {
                        overlay.innerText = `SALDO: R$ ${total.toFixed(2).replace('.', ',')}`;
                        overlay.style.display = 'block';
                    }
                    if (initialCheck && total < 5.00) {
                        initialCheck = false;
                        openDeposit();
                    }
                    initialCheck = false;
                }
            });
        }
        setTimeout(check, 1000);
        setInterval(check, 10000);
    })();
  </script>

  <!-- Bibliotecas do Jogo -->
  <script src="spine-webgl.js"></script>
  <script src="spine-draw.js"></script>
  <script src="spine-gl-cache.js"></script>
  <script src="spine-bone-control.js"></script>
  <script src="spine-palette.js"></script>
  
  <noscript>
    <div id="notSupportedWrap">
      <h2 id="notSupportedTitle">Este conteúdo requer JavaScript</h2>
      <p class="notSupportedMessage">O JavaScript parece estar desativado. Por favor, ative-o para visualizar este conteúdo.</p>
    </div>
  </noscript>

  <script src="scripts/supportcheck.js"></script>
  <script src="scripts/offlineclient.js" type="module"></script>
  <script src="scripts/main.js" type="module"></script>
  <script src="scripts/register-sw.js" type="module"></script>
</body>
</html>
