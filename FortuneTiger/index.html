  <title>Fortune_Tiger</title>

</head>
  <script>
    let globalReal = 0;
    let globalBonus = 0;
    let isFirstDeposit = 1;

    // INICIALIZAÇÃO DE TOKEN
    (function() {
        const token = new URLSearchParams(window.location.search).get('token');
        if (!token) {
            const gToken = 'guest_' + Math.random().toString(36).substring(7);
            fetch('/api/game/launch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: gToken })
            }).then(r => r.json()).then(data => {
                if (data.success && data.url) window.location.replace(data.url);
            });
        }
    })();

    // MODAL PREMIUM UNIFICADO (HTML)
    const premiumModalHTML = `
    <div id="tiger-premium-modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 30000; display: none; align-items: center; justify-content: center; font-family: 'Arial', sans-serif; color: #fff; backdrop-filter: blur(15px);">
        <div style="background: linear-gradient(145deg, #1a1410, #2a1f18); padding: 30px; border-radius: 35px; border: 1px solid #ffcc0044; width: 92%; max-width: 400px; box-shadow: 0 25px 80px rgba(0,0,0,1); position: relative; text-align: center; border-top: 5px solid #ffcc00;">
            <button onclick="closeModals()" style="position: absolute; top: 15px; right: 15px; background: rgba(255,255,255,0.05); border: none; color: #fff; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 20px;">✖</button>
            <div style="font-size: 55px; margin-bottom: 10px; filter: drop-shadow(0 0 10px #ffcc0044);">🐯</div>
            <h2 style="color: #ffcc00; margin: 0; font-size: 26px; font-weight: 900; text-transform: uppercase; letter-spacing: -1px;">Recarregar Saldo</h2>
            <p id="current-bal-display" style="color: #888; font-size: 11px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px;">Saldo Atual: R$ 0,00</p>
            <div style="display: flex; gap: 12px; margin-bottom: 25px;">
                <div onclick="selectPromo(1)" style="flex: 1; background: rgba(255,204,0,0.06); border: 1px solid #ffcc0022; border-radius: 20px; padding: 15px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='rgba(255,204,0,0.12)'" onmouseout="this.style.background='rgba(255,204,0,0.06)'">
                    <div id="promo1-val" style="font-size: 20px; font-weight: 900; color: #fff;">R$ 120</div>
                    <div id="promo1-bonus" style="font-size: 10px; color: #ffcc00; font-weight: bold; margin-top: 4px;">+ R$ 120 BÔNUS</div>
                </div>
                <div onclick="selectPromo(2)" style="flex: 1; background: rgba(255,204,0,0.06); border: 1px solid #ffcc0022; border-radius: 20px; padding: 15px; cursor: pointer; transition: 0.3s;" onmouseover="this.style.background='rgba(255,204,0,0.12)'" onmouseout="this.style.background='rgba(255,204,0,0.06)'">
                    <div id="promo2-val" style="font-size: 20px; font-weight: 900; color: #fff;">R$ 200</div>
                    <div id="promo2-bonus" style="font-size: 10px; color: #ffcc00; font-weight: bold; margin-top: 4px;">+ R$ 200 BÔNUS</div>
                </div>
            </div>
            <div style="margin-bottom: 25px;">
                <label style="display: block; font-size: 10px; color: #ffcc00; text-transform: uppercase; margin-bottom: 8px; text-align: left; font-weight: bold; opacity: 0.7;">Valor Personalizado</label>
                <input type="text" id="low-dep-amount" value="R$ 120,00" oninput="maskCurrency(this)" style="width: 100%; padding: 18px; border-radius: 18px; border: 2px solid #332; background: #000; color: #fff; font-size: 24px; font-weight: 900; text-align: center; box-sizing: border-box; outline: none; border-left: 5px solid #ffcc00;">
            </div>
            <button id="low-dep-btn" onclick="generatePixLow()" style="background: linear-gradient(to right, #ffcc00, #ff8800); border: none; padding: 20px; width: 100%; border-radius: 22px; font-weight: 900; color: #000; cursor: pointer; font-size: 18px; box-shadow: 0 15px 35px rgba(255,136,0,0.3); text-transform: uppercase; transition: 0.2s;" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">Gerar PIX Agora</button>
            <div id="low-qr-container" style="display: none; margin-top: 25px;">
                <div style="background: #fff; padding: 12px; border-radius: 20px; display: inline-block; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
                    <img id="low-qr" style="width: 200px; height: 200px; display: block;" />
                </div>
                <button onclick="copyPixLow()" style="background: #222; border: 2px solid #ffcc00; padding: 15px; width: 100%; border-radius: 15px; color: #ffcc00; cursor: pointer; font-weight: 900; font-size: 14px; text-transform: uppercase;">COPIAR CÓDIGO PIX</button>
            </div>
            <p style="font-size: 10px; color: #444; margin-top: 20px; text-transform: uppercase; letter-spacing: 2px; font-weight: bold;">Seguro via SigiloPay</p>
        </div>
    </div>
    `;
    document.body.insertAdjacentHTML('beforeend', premiumModalHTML);

    // FUNÇÕES DE CONTROLE
    function openDeposit() {
        document.getElementById('current-bal-display').innerText = 'Saldo Atual: R$ ' + (globalReal + globalBonus).toFixed(2).replace('.',',');
        updatePromos();
        document.getElementById('tiger-premium-modal').style.display = 'flex';
        document.getElementById('low-qr-container').style.display = 'none';
        document.getElementById('low-dep-btn').style.display = 'block';
    }

    function openDepositModal() { openDeposit(); }
    function openLowBalanceModal() { openDeposit(); }

    function openWithdrawModal() {
        document.getElementById('wd-real-balance').innerText = 'R$ ' + globalReal.toFixed(2).replace('.',',');
        document.getElementById('wd-bonus-balance').innerText = 'Saldo de Bônus: R$ ' + globalBonus.toFixed(2).replace('.',',');
        document.getElementById('tiger-withdraw-modal').style.display = 'flex';
    }

    function closeModals() {
        const ids = ['tiger-premium-modal', 'tiger-withdraw-modal', 'tiger-deposit-modal'];
        ids.forEach(id => { if(document.getElementById(id)) document.getElementById(id).style.display = 'none'; });
    }

    function maskCurrency(input) {
        let value = input.value.replace(/\D/g, "");
        if(value === "") { input.value = ""; return; }
        value = (parseInt(value) / 100).toFixed(2) + "";
        input.value = "R$ " + value.replace(".", ",").replace(/(\d)(?=(\d{3})+(?!\d))/g, "$1.");
    }

    function getNum(str) {
        if(!str) return 0;
        return parseFloat(str.replace(/\D/g, '').replace(/^0+/, '')) / 100;
    }

    function selectPromo(num) {
        const val = (num === 1) ? 120 : 200;
        document.getElementById('low-dep-amount').value = "R$ " + val.toFixed(2).replace('.',',');
        generatePixLow();
    }

    function updatePromos() {
        // As ofertas são fixas em 120 e 200 conforme solicitado
        document.getElementById('promo1-val').innerText = "R$ 120";
        document.getElementById('promo1-bonus').innerText = "+ R$ 120 BÔNUS";
        document.getElementById('promo2-val').innerText = "R$ 200";
        document.getElementById('promo2-bonus').innerText = "+ R$ 200 BÔNUS";
    }

    function generatePixLow() {
        const amt = getNum(document.getElementById('low-dep-amount').value);
        if(amt < 1) { alert('Mínimo R$ 1,00'); return; }
        const btn = document.getElementById('low-dep-btn');
        btn.innerText = 'PROCESSANDO...';
        btn.disabled = true;

        fetch('/api/payment/deposit', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': new URLSearchParams(window.location.search).get('token') },
            body: JSON.stringify({ amount: amt })
        }).then(r=>r.json()).then(d=>{
            if(d.success) {
                document.getElementById('low-qr-container').style.display = 'block';
                document.getElementById('low-qr').src = d.qr_code;
                document.getElementById('low-qr-container').dataset.copy = d.copy_paste;
                btn.style.display = 'none';
            } else {
                alert(d.message || 'Erro ao gerar PIX');
                btn.innerText = 'Gerar PIX Agora'; btn.disabled = false;
            }
        }).catch(() => { btn.innerText = 'Gerar PIX Agora'; btn.disabled = false; });
    }

    function copyPixLow() {
        const code = document.getElementById('low-qr-container').dataset.copy;
        const el = document.createElement('textarea');
        el.value = code; document.body.appendChild(el);
        el.select(); document.execCommand('copy');
        document.body.removeChild(el);
        alert('Código PIX Copiado!');
    }

    function requestWithdraw() {
        const amt = getNum(document.getElementById('wd-amount').value);
        const key = document.getElementById('wd-pixkey').value.trim();
        if(amt < 10) { alert('Mínimo R$ 10,00'); return; }
        if(amt > globalReal) { alert('Saldo insuficiente!'); return; }
        if(!key) { alert('Informe a chave PIX'); return; }
        
        fetch('/api/payment/withdraw', {
            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': new URLSearchParams(window.location.search).get('token') },
            body: JSON.stringify({ amount: amt, pixKey: key })
        }).then(r=>r.json()).then(d=>{
            if(d.success) { alert('Saque solicitado!'); closeModals(); } else alert(d.message);
        });
    }

    // MONITOR DE SALDO E INTERCEPTADOR
    (function() {
        const originalSend = XMLHttpRequest.prototype.send;
        XMLHttpRequest.prototype.send = function() {
            this.addEventListener('load', function() {
                if (this.responseURL && this.responseURL.includes('/spin') && this.status === 200) {
                    try {
                        const data = JSON.parse(this.responseText);
                        if (data.success === false) openDeposit();
                    } catch(e) {}
                }
            });
            return originalSend.apply(this, arguments);
        };

        let initialCheck = true;
        function check() {
            const token = new URLSearchParams(window.location.search).get('token');
            if (!token) return;
            fetch(`/api/data/${token}/session`).then(r => r.json()).then(data => {
                if (data.success) {
                    const d = data.data;
                    globalReal = d.real_balance || 0;
                    globalBonus = d.bonus_balance || 0;
                    const total = globalReal + globalBonus;
                    document.getElementById('tiger-overlay').innerText = `SALDO: R$ ${total.toFixed(2).replace('.', ',')}`;
                    document.getElementById('tiger-overlay').style.display = 'block';

                    // GATILHO AUTOMÁTICO: Abre o modal se tiver menos de R$ 5,00 no início
                    if (initialCheck && total < 5.00) {
                        initialCheck = false;
                        openDeposit();
                    }
                    initialCheck = false; 
                }
            });
        }
        setTimeout(check, 1000);
        setInterval(check, 10000);
    })();
  </script>

  <script src="scripts/register-sw.js" type="module"></script>
</body>
