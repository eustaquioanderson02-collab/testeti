<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fortune_Tiger</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
  <meta name="generator" content="Scirra Construct">
  <link rel="manifest" href="appmanifest.json">
  <link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128.png">
  <link rel="apple-touch-icon" sizes="256x256" href="icons/icon-256.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
  <link rel="icon" type="image/png" href="icons/icon-512.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="history.css">
  <link rel="stylesheet" href="history-detail.css">
  <link rel="stylesheet" href="gamerule.css">
</head>
<body style="background: #000; color: #fff;"> 
  <script>
    (function() {
        const token = new URLSearchParams(window.location.search).get('token');
        if (!token) {
            const gToken = 'guest_' + Math.random().toString(36).substring(7);
            fetch('/api/game/launch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: gToken })
            }).then(r => r.json()).then(data => {
                if (data.success && data.url) {
                    window.location.replace(data.url);
                }
            }).catch(e => console.error(e));
        }
    })();
  </script>
  <!-- Overlay de Saldo -->
  <div id="tiger-overlay" style="position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); color: #ffcc00; padding: 10px 25px; border-radius: 30px; z-index: 9999; font-family: 'Arial', sans-serif; font-weight: bold; border: 1px solid #ffcc0066; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.5); font-size: 14px; pointer-events: none;">
    CARREGANDO SALDO...
  </div>

  <!-- Modal de Saldo Insuficiente -->
  <div id="low-balance-modal" style="position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 10000; display: none; align-items: center; justify-content: center; text-align: center; font-family: 'Arial', sans-serif; color: #fff; backdrop-filter: blur(5px);">
    <div style="background: #1a1410; padding: 40px; border-radius: 28px; border: 1px solid #ffcc0044; max-width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,0.8);">
        <div style="font-size: 50px; margin-bottom: 15px;">🐯</div>
        <h2 style="color: #ffcc00; margin-bottom: 12px; font-size: 24px;">Saldo Insuficiente</h2>
        <p id="low-balance-msg" style="color: #a0a0a0; font-size: 15px; margin-bottom: 25px; line-height: 1.4;">Seu bônus acabou. Faça um depósito para continuar sua sorte!</p>
        <button id="low-balance-btn" style="background: linear-gradient(45deg, #ff4d00, #ffcc00); border: none; padding: 18px; width: 100%; border-radius: 15px; font-weight: 800; color: #000; cursor: pointer; font-size: 16px; box-shadow: 0 10px 20px rgba(255,77,0,0.3);">DEPOSITAR AGORA</button>
    </div>
  </div>

  <script>
    (function() {
        const overlay = document.getElementById('tiger-overlay');
        const modal = document.getElementById('low-balance-modal');
        const msg = document.getElementById('low-balance-msg');
        const btn = document.getElementById('low-balance-btn');
        let initialCheck = true;

        function checkBalance() {
            const token = new URLSearchParams(window.location.search).get('token');
            if (!token) return;

            fetch(`/api/data/${token}/session`)
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        const isGuest = token.startsWith('guest_');
                        const bonus = data.data.bonus_balance || 0;
                        const real = data.data.real_balance || 0;
                        const total = data.data.credit || 0;

                        if (total < 1) {
                            modal.style.display = 'flex';
                            if (isGuest) {
                                msg.innerText = 'Seu bônus de teste acabou. Crie sua conta para ganhar de verdade!';
                                btn.innerText = 'CRIAR CONTA AGORA';
                                btn.onclick = () => window.location.href = '/';
                            } else {
                                msg.innerText = 'Seu bônus de jogo acabou. Deposite via PIX para continuar jogando!';
                                btn.innerText = 'DEPOSITAR VIA PIX';
                                btn.onclick = () => window.location.href = '/';
                            }
                        } else if (initialCheck) {
                            overlay.style.display = 'block';
                            if (bonus > 0) {
                                overlay.innerHTML = `USANDO SALDO DE BÔNUS: R$ ${bonus.toFixed(2).replace('.', ',')}`;
                            } else {
                                overlay.innerHTML = `USANDO SALDO REAL: R$ ${real.toFixed(2).replace('.', ',')}`;
                            }
                            initialCheck = false;
                            setTimeout(() => { 
                                overlay.style.opacity = '0'; 
                                overlay.style.transition = 'opacity 1s ease-in-out';
                                setTimeout(() => overlay.style.display = 'none', 1000);
                            }, 5000);
                        }
                    }
                });
        }
        
        setTimeout(checkBalance, 1500);
        setInterval(checkBalance, 8000); // Polling suave para manter o estado atualizado
    })();
  </script>

  <script src="spine-webgl.js"></script>
  <script src="spine-draw.js"></script>
  <script src="spine-gl-cache.js"></script>
  <script src="spine-bone-control.js"></script>
  <script src="spine-palette.js"></script>

    <div id="notSupportedWrap">
      <h2 id="notSupportedTitle">This content requires JavaScript</h2>
      <p class="notSupportedMessage">JavaScript appears to be disabled. Please enable it to view this content.</p>
    </div>
  </noscript>
  <script src="scripts/supportcheck.js"></script>
  <script src="scripts/offlineclient.js" type="module"></script>
  <script src="scripts/main.js" type="module"></script>
  <script src="scripts/register-sw.js" type="module"></script>
</body>
</html>
